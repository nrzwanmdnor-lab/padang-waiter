name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android project (keeps our code)
        run: |
          cp lib/main.dart /tmp/main.dart && cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name padang_waiter .
          cp /tmp/main.dart lib/main.dart && cp /tmp/pubspec.yaml pubspec.yaml && rm -rf test
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: padang-waiter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
